name: CI

on:
  push:
    branches: [main, develop]
    # Without this the release job below can never run. A `branches` filter
    # does not match a tag push, so a `v*` tag triggered nothing at all and
    # `build-android-release`'s own `if: startsWith(github.ref,
    # 'refs/tags/v')` was unreachable — the one job the release procedure
    # depends on.
    tags: ['v*']
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs on the same branch to save quota
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    # Secrets are exposed as job-level env so step `if:` conditions can test
    # them (a step's own `env:` is not visible to its `if:`).
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'  # Pinned; update .fvmrc and here in sync
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze (zero warnings policy)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run unit tests with coverage
        run: flutter test --coverage --reporter=github

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          file: coverage/lcov.info
          fail_ci_if_error: false   # Non-blocking — coverage is advisory

  build-android-debug:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    needs: analyze-and-test   # Only build if analysis passes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (required by Gradle 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --no-shrink

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ── Release build — only on push to main via tag ──────────────────────────
  build-android-release:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Without these the Gradle build silently falls back to debug signing;
      # a release must never ship like that.
      - name: Require signing secrets
        run: |
          missing=""
          for name in RELEASE_KEYSTORE_BASE64 KEY_STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing release signing secrets:$missing"
            exit 1
          fi

      - name: Decode release keystore
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/lumivolt-release.jks

      # storeFile is resolved relative to android/app (build.gradle.kts).
      - name: Write android/key.properties
        run: |
          {
            echo "storeFile=lumivolt-release.jks"
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      # Which backend the release talks to is decided here: `activeBackend`
      # is Appwrite when the endpoint and project id are both non-empty and
      # Supabase otherwise, so a tag built without the APPWRITE_* secrets
      # ships a Supabase build. See docs/DEPLOYMENT.md section 6.
      #
      # Empty values are dropped rather than written. A define that is
      # present but empty beats the Dart default — an unset
      # APPWRITE_DATABASE_ID secret would otherwise compile in `""` instead
      # of `cradi` and every call would 404.
      - name: Write env.json (runtime config)
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
          APPWRITE_PUSH_PROVIDER_ANDROID: ${{ secrets.APPWRITE_PUSH_PROVIDER_ANDROID }}
          APPWRITE_PUSH_PROVIDER_IOS: ${{ secrets.APPWRITE_PUSH_PROVIDER_IOS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          jq -n '{APPWRITE_ENDPOINT: env.APPWRITE_ENDPOINT,
                  APPWRITE_PROJECT_ID: env.APPWRITE_PROJECT_ID,
                  APPWRITE_DATABASE_ID: env.APPWRITE_DATABASE_ID,
                  APPWRITE_PUSH_PROVIDER_ANDROID: env.APPWRITE_PUSH_PROVIDER_ANDROID,
                  APPWRITE_PUSH_PROVIDER_IOS: env.APPWRITE_PUSH_PROVIDER_IOS,
                  SUPABASE_URL: env.SUPABASE_URL, SUPABASE_ANON_KEY: env.SUPABASE_ANON_KEY,
                  ONESIGNAL_APP_ID: env.ONESIGNAL_APP_ID,
                  SENTRY_DSN: env.SENTRY_DSN}
                 | with_entries(select(.value != null and .value != ""))' > env.json
          jq -r 'if (.APPWRITE_ENDPOINT // "") != "" and (.APPWRITE_PROJECT_ID // "") != ""
                 then "backend: Appwrite (\(.APPWRITE_ENDPOINT))"
                 else "backend: Supabase" end' env.json

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Verify release signature
        run: |
          set -euo pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # Capture first: a failing apksigner (unsigned / corrupt APK) must
          # fail the step, not read as "not debug-signed".
          certs=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          if grep -q "CN=Android Debug" <<<"$certs"; then
            echo "::error::Release APK is debug-signed"
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ── Node packages — run their test suites on every push/PR ────────────────
  backend-test:
    name: Backend (Node) Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'          # Matches backend/package.json engines
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` also fails when package-lock.json has drifted from
      # package.json, which is the check we want on every push.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  migration-test:
    name: Migration Tool (Node) Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: migration/firebase-to-supabase

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: migration/firebase-to-supabase/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  appwrite-functions-test:
    name: Appwrite Functions (Node) Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions/cradi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'          # Matches the Appwrite runtime

      # No `npm ci`: these Functions have no dependencies on purpose —
      # every one is paid again on every cold start, and Phase 4 measured
      # 735 ms for that. There is nothing to install and no lock file.
      - name: Run tests
        run: npm test

  # ── Docker image builds (backend deploys from this Dockerfile) ────────────
  backend-docker-build:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build only — nothing is pushed, so no registry credentials are needed.
      - name: Build backend image
        run: docker build -t cradi-backend:${{ github.sha }} backend
