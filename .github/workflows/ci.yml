name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs on the same branch to save quota
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    # Secrets are exposed as job-level env so step `if:` conditions can test
    # them (a step's own `env:` is not visible to its `if:`).
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.38.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'  # Pinned; update .fvmrc and here in sync
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze (zero warnings policy)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run unit tests with coverage
        run: flutter test --coverage --reporter=github

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          file: coverage/lcov.info
          fail_ci_if_error: false   # Non-blocking — coverage is advisory

  build-android-debug:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    needs: analyze-and-test   # Only build if analysis passes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (required by Gradle 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.38.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --no-shrink

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ── Release build — only on push to main via tag ──────────────────────────
  build-android-release:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.38.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Without these the Gradle build silently falls back to debug signing;
      # a release must never ship like that.
      - name: Require signing secrets
        run: |
          missing=""
          for name in RELEASE_KEYSTORE_BASE64 KEY_STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing release signing secrets:$missing"
            exit 1
          fi

      - name: Decode release keystore
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/lumivolt-release.jks

      # storeFile is resolved relative to android/app (build.gradle.kts).
      - name: Write android/key.properties
        run: |
          {
            echo "storeFile=lumivolt-release.jks"
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      - name: Write env.json (runtime config)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          jq -n '{SUPABASE_URL: env.SUPABASE_URL, SUPABASE_ANON_KEY: env.SUPABASE_ANON_KEY,
                  ONESIGNAL_APP_ID: env.ONESIGNAL_APP_ID, BACKEND_URL: env.BACKEND_URL,
                  SENTRY_DSN: env.SENTRY_DSN}' > env.json

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Verify release signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -q "CN=Android Debug"; then
            echo "::error::Release APK is debug-signed"
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
